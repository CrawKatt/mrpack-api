[package]
name = "mrpack_api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Secure API and administrative panel for distributing Modrinth modpacks"
repository = "https://github.com/CrawKatt/mrpack_api"
keywords = ["minecraft", "modrinth", "modpack", "axum", "api"]
categories = ["web-programming::http-server"]
publish = false

[dependencies]
# Web Framework
axum = { version = "0.8.6", features = ["multipart"] }
tokio = { version = "1.35", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "set-header"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File handling
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

# Security - Password hashing
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.21"

# Configuration
dotenvy = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Misc Utils
hex = "0.4.3"
num-traits = "0.2.19"
sha2 = "0.10"
zeroize = "1.9.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
